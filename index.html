<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Combat Calculator</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app">
<div id="status" class="status">Loading matrices…</div>
<section class="setup card">
<div class="segmented"><button data-attacker="government" class="active">Government</button><button data-attacker="rebels">Rebels</button></div>
<div class="terrain"><button data-terrain="city" class="active" aria-label="City or Town"><b>🏙️</b></button><button data-terrain="plains" aria-label="Plains"><b>🌾</b></button><button data-terrain="forest" aria-label="Forest"><b>🌲</b></button><button data-terrain="mountain" aria-label="Mountain"><b>⛰️</b></button></div>
<div class="slider"><label>Political Standing</label><input id="political" type="range" min="-7" max="7" value="0"><output id="politicalValue">0</output></div>
<div class="slider"><label>Intelligence Cards</label><input id="intel" type="range" min="0" max="5" value="0"><output id="intelValue">0</output></div>
<div class="slider"><label>Attacking Units</label><input id="attackers" type="range" min="1" max="5" value="1"><output id="attackersValue">1</output></div>
<div class="slider"><label>Damaged Attackers</label><input id="damaged" type="range" min="0" max="5" value="0"><output id="damagedValue">0</output></div>
<div class="slider"><label>Defending Units</label><input id="defenders" type="range" min="1" max="5" value="1"><output id="defendersValue">1</output></div>
<div class="combat-row"><div class="dice"><input id="redDie" class="die red" type="number" min="1" max="6" inputmode="numeric" aria-label="Red die"><input id="blueDie" class="die blue" type="number" min="1" max="6" inputmode="numeric" aria-label="Blue die"><input id="greenDie" class="die green" type="number" min="1" max="6" inputmode="numeric" aria-label="Green die"></div><div class="actions"><button id="roll" class="primary">ROLL</button><button id="reset">RESET</button></div></div>
</section>
<section class="results">
<article class="result attacker"><div class="result-head"><h2>ATTACKER</h2><div class="actual"><strong id="attackerActual">–</strong><span>Damage Caused</span></div></div><div id="attackerProb"></div><footer>Expected: <b id="attackerExpected">0.00</b></footer></article>
<article class="result defender"><div class="result-head"><h2>DEFENDER</h2><div class="actual"><strong id="defenderActual">–</strong><span>Damage Taken</span></div></div><div id="defenderProb"></div><footer>Expected: <b id="defenderExpected">0.00</b></footer></article>
</section>
</main><script src="app.js" defer></script></body></html>
